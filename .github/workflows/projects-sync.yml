# §17 — refresh the project snapshot every 6 h.
#
# The site serves `src/data/pinned-projects.json` and never talks to GitHub at
# build or render time, so this job is the only thing that reads the profile.
# It is also the only thing that *writes* the snapshot: a serverless filesystem
# is read-only, so `/api/sync-projects` cannot do it in production (it answers
# 501 there and names this file).
#
# The write is a commit: `node scripts/sync-projects.mjs` validates the payload
# first and only then replaces the file atomically, so a rejected refresh leaves
# the previous snapshot untouched and the commit step finds nothing to push.
# `generatedAt` therefore moves only when the data really moved, which is what
# the sitemap `lastmod`, the JSON-LD `dateModified` and the page's "última
# actualización" are read from.
#
# The token is the workflow's own `GITHUB_TOKEN`: reading the public profile's
# pins needs a credential only for the GraphQL rate limit, and pushing the one
# file needs `contents: write`. No repository secret is required.
name: projects-sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projects-sync
  cancel-in-progress: false

jobs:
  sync:
    name: refresh project snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The script imports node builtins and `src/lib` only, so there is nothing
      # to install: the snapshot refresh cannot be broken by a dependency.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh the snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-projects.mjs

      - name: Commit only when the file changed
        run: |
          set -euo pipefail

          if git diff --quiet -- src/data/pinned-projects.json; then
            echo "snapshot unchanged — nothing to commit"
            echo "### projects-sync" >> "$GITHUB_STEP_SUMMARY"
            echo "- snapshot unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sha=$(node -e 'const s=require("./src/data/pinned-projects.json"); console.log(s.generatedAt)')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pinned-projects.json
          git commit -m "chore(projects): refresh the snapshot (generatedAt ${sha})"
          git push

          echo "### projects-sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- snapshot committed, generatedAt: \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"
